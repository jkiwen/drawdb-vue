name: Package

# The development stage does not publish to npm. The workflow checks the
# workspace, builds the two packages and packs them into tarballs, so that the
# distribution can be installed and tested locally:
#
#   pnpm run pack:packages
#   npm install ./drawdb-core-0.1.0.tgz
#
# The publication to npm is deliberately not a part of this workflow. It is
# added back when the packages are ready for the registry.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:packages
      - run: pnpm run test
      - name: Pack the two packages
        run: pnpm run pack:packages
      - name: Upload the tarballs
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: .release/*.tgz
          if-no-files-found: error
